services:
  backend:
    build: 
      context: ./backend
    container_name: escreveai_backend
    volumes:
      - escreveai_data:/app/data
      - escreveai_cache:/root/.cache
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=sqlite:///./data/transcriber.db
      - DATA_DIR=./data
      - MAX_FILE_SIZE_MB=1024
      - MAX_DURATION_MINUTES=180
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    # Opcional: Se quiser habilitar GPU (CUDA) no Docker (Requer nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    container_name: escreveai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  escreveai_data:
  escreveai_cache:
